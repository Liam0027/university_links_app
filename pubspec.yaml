name: university_links_app
description: "A Flutter app for quick access to National University of Skills (Gilan) portals and websites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  # flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.0.1
  # flutter_native_splash: ^2.4.8
  google_fonts: ^8.1.0
  http: ^1.6.0
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

