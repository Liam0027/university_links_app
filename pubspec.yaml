name: university_links_app
description: "A Flutter app for quick access to National University of Skills (Gilan) portals and websites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.0.1
  flutter_native_splash: ^2.4.8
  google_fonts: ^8.1.0
  http: ^1.6.0
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#172550"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter_native_splash:
  # Light mode: white background, dark-colored logo/branding.
  # Dark mode (_dark suffix): navy background, light-colored logo/branding.
  color: "#FFFFFF"
  color_dark: "#172550"
  image: "assets/splash/icon_light.png"
  image_dark: "assets/splash/icon_dark.png"
  branding: "assets/splash/branding.png"
  branding_dark: "assets/splash/branding_dark.png"
  android: true
  ios: false
  android_12:
    image: "assets/splash/icon_light.png"
    image_dark: "assets/splash/icon_dark.png"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#172550"
    color: "#FFFFFF"
    color_dark: "#172550"
    branding: "assets/splash/branding.png"
    branding_dark: "assets/splash/branding_dark.png"
